[project]
name = "jobscout"
version = "0.1.0"
description = "A personal job-hunt agent for one real candidate's search."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-openai>=1.6",
    "pypdf>=6.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "trafilatura>=1.12",
    "fastembed>=0.8.0",
    "python-telegram-bot[job-queue]>=21.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.2.3",
]

[project.scripts]
jobscout = "jobscout.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]
